<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>VAMRSS / SERIES</title>
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="VAMRSS series detail page.">
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --invert-bg: #111714;
      --invert-ink: #f8f9f9;
      --danger: #9b3144;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #101312;
      --ink: #edf1ef;
      --sub: #a4aeaa;
      --muted: #707b77;
      --invert-bg: #edf1ef;
      --invert-ink: #101312;
      --danger: #e28a9a;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    button, input, textarea, select { font: inherit; }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: calc(max(18px, env(safe-area-inset-top)) + 24px) 20px max(36px, env(safe-area-inset-bottom));
      position: relative;
    }

    .dos-fixed-control {
      position: fixed;
      z-index: 50;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--sub);
      padding: 0;
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .dos-close-control {
      top: max(18px, env(safe-area-inset-top));
      left: 20px;
    }

    .dos-share-control {
      top: max(18px, env(safe-area-inset-top));
      right: 20px;
    }

    .dos-copyright-note {
      position: fixed;
      left: 20px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 40;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .version {
      position: fixed;
      right: 20px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 40;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
      pointer-events: none;
    }

    .dos-top-background,
    .dos-bottom-background {
      position: fixed;
      left: 20px;
      right: 20px;
      z-index: 0;
      pointer-events: none;
      color: rgba(104, 115, 111, 0.18);
    }

    .dos-top-background {
      top: 78px;
    }

    .dos-bottom-background {
      bottom: 58px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .dos-output-note {
      color: rgba(104, 115, 111, 0.28);
      font-size: 10px;
      line-height: 1.45;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dos-top-background-logo,
    .dos-bottom-background-logo {
      width: 90px;
      max-width: 22vw;
      height: auto;
      opacity: 0.08;
    }

    .dos-top-background-logo {
      margin-top: 20px;
    }

    .dos-header,
    #detailHost,
    .status {
      position: relative;
      z-index: 1;
    }

    .dos-header {
      margin: 38px 0 40px;
    }

    .dos-up-logo-block,
    .dos-logo-block {
      line-height: 0;
    }

    .dos-up-logo,
    .dos-logo {
      display: block;
      width: 145px;
      max-width: 38vw;
      height: auto;
    }

    .dos-topline {
      margin-top: 12px;
      color: var(--sub);
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .dos-order-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .dos-header-rule {
      height: 1px;
      margin-top: 14px;
      background: var(--ink);
      opacity: 0.22;
    }

    .dos-barcode {
      margin-top: 12px;
      color: var(--sub);
    }

    .dos-barcode-svg {
      display: block;
      width: 100%;
      height: 34px;
      fill: currentColor;
    }

    .dos-barcode-text {
      margin-top: 2px;
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .dos-barcode-bottom {
      margin-top: 36px;
    }

    .dos-bottom-inner-logo {
      display: block;
      width: 120px;
      max-width: 32vw;
      height: auto;
      margin-top: 20px;
      opacity: 0.72;
    }

    .detail-grid {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 10px;
      align-items: baseline;
      margin: 0;
      padding: 0;
    }

    .detail-key {
      color: var(--muted);
      text-align: left;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .detail-value {
      color: var(--ink);
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-width: 0;
    }

    .series-title-row,
    .series-title-en-row,
    .top-image-row,
    .top-logo-row,
    .author-row,
    .description-row,
    .description-en-row,
    .works-row,
    .bottom-image-row,
    .bottom-logo-row {
      margin-top: 1em;
    }

    .top-logo-stack,
    .bottom-logo-stack,
    .top-image-stack,
    .bottom-image-stack {
      display: grid;
      gap: 1em;
    }

    figure {
      margin: 0;
      padding: 0;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      object-position: left top;
    }

    .caption,
    figcaption {
      margin: 0;
      padding: 0;
      color: var(--sub);
      font-size: 11px;
      line-height: 1.45;
    }

    .author-row .detail-value a,
    .mention-link {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      text-underline-offset: 0.18em;
    }

    .mention-kind {
      color: var(--sub);
      margin-right: 0.25em;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .works-row {
      align-items: start;
    }

    .works-row .detail-value {
      white-space: normal;
      overflow: visible;
    }

    .work-list {
      display: grid;
      gap: 0;
      width: 100%;
      min-width: 0;
    }

    .work-link-row {
      display: grid;
      grid-template-columns: 4.5em minmax(0, 1fr) 7.5em;
      gap: 1em;
      align-items: baseline;
      width: 100%;
      min-width: 0;
      padding: 0;
      color: inherit;
      text-decoration: none;
      line-height: 2;
    }

    .work-link-row span {
      min-width: 0;
    }

    .work-link-row span:first-child {
      color: var(--sub);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .work-link-row span:nth-child(2) {
      overflow-wrap: anywhere;
    }

    .work-link-row span:nth-child(3) {
      color: var(--sub);
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .status,
    .empty {
      color: var(--sub);
    }

    @media (max-width: 420px) {
      .detail-row {
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 10px;
      }

      .work-link-row {
        grid-template-columns: 4.5em minmax(0, 1fr);
      }

      .work-link-row span:nth-child(3) {
        grid-column: 2;
        text-align: left;
      }
    }
  </style>
</head>
<body>

  <button class="dos-fixed-control dos-share-control" type="button" onclick="shareFixedDocument()" aria-label="Share page">SHAREする</button>
  <div class="dos-copyright-note">(C) 2026 <a href="../profile/">SHIRASUSALAD</a></div>
  <div class="dos-top-background">
    <div class="dos-output-note">このページは<br>DOCUMENT ORDER SYSTEM V2.0.0<br>によって出力されました。</div>
    <img class="dos-top-background-logo" src="../assets/dos-bg-logo.svg" alt="DOCUMENT ORDER SYSTEM auxiliary mark">
  </div>
  <main class="app">
    <header class="dos-header">
      <div class="dos-up-logo-block"><img class="dos-up-logo" src="../assets/dosup-logo.svg" alt="DOS UPPER LOGO"></div>
      <div class="dos-topline"><div class="dos-system-title">DOCUMENT ORDER SYSTEM V2.0.0</div></div>
      <div class="dos-barcode dos-barcode-top" id="dosBarcode" aria-label="CODE128 barcode"></div>
      <div class="dos-logo-block"><img class="dos-logo" src="../assets/dos-logo.svg" alt="DOCUMENT ORDER SYSTEM"></div>

      <div class="dos-header-rule" aria-hidden="true"></div>
    </header>
    <section id="detailHost" class="empty">Loading...</section>
    <div class="status" id="statusText"></div>
    <div class="version">v3.9.48</div>
    <div class="dos-barcode dos-barcode-bottom" id="dosBarcodeBottom" aria-label="CODE128 barcode"></div>
    <img class="dos-bottom-inner-logo" src="../assets/dosdown-logo.svg" alt="DOCUMENT ORDER SYSTEM lower mark">
  </main>
  <div class="dos-bottom-background">
    <img class="dos-bottom-background-logo" src="../assets/dos-bg-logo.svg" alt="DOCUMENT ORDER SYSTEM auxiliary mark">
    <div class="dos-output-note">このページは<br>DOCUMENT ORDER SYSTEM V2.0.0<br>によって出力されました。</div>
  </div>

  <script>
    const SUPABASE_URL = "https://xovbmsyjhtlxldtjbvvm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gP9cTUqzNytHEXRUY9-dug__quOy4fv";

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function normalizeNo(value) {
      const raw = String(value ?? "").trim();
      if (!raw) return "";
      const digits = raw.replace(/\D/g, "");
      return digits ? digits.padStart(4, "0").slice(-4) : raw;
    }

    function formatDimensions(work) {
      const h = work.size_h ?? "";
      const w = work.size_w ?? "";
      const d = work.size_d ?? "";
      const parts = [];
      if (h !== "") parts.push(`H ${h}`);
      if (w !== "") parts.push(`W ${w}`);
      if (d !== "") parts.push(`D ${d}`);
      return parts.length ? `${parts.join(" / ")} mm` : "";
    }

    function workTitle(work) {
      return work.title || work.title_ja || work.title_en || "Untitled";
    }

    function seriesTitle(series) {
      return series.title || series.title_ja || series.title_en || "Untitled";
    }

    function getQueryNo() {
      return normalizeNo(new URLSearchParams(location.search).get("no") || "");
    }

    function siteBaseUrl() {
      const path = location.pathname || "/";
      const lower = path.toLowerCase();
      let basePath = path;
      ["/work/", "/series/", "/updates/", "/profile/", "/admin/", "/portfolio/"].forEach(segment => {
        const index = lower.indexOf(segment);
        if (index >= 0) basePath = path.slice(0, index + 1);
      });
      return location.origin + basePath;
    }

    function detailUrl(type, no) {
      return `${siteBaseUrl()}${type === "series" ? "series" : "work"}/?no=${encodeURIComponent(normalizeNo(no))}`;
    }

    async function shareCurrent(type, no, title) {
      const shareUrl = detailUrl(type, no);
      const shareTitle = title ? `VAMRSS / ${title}` : "VAMRSS";
      try {
        if (navigator.share) {
          await navigator.share({ title: shareTitle, text: shareTitle, url: shareUrl });
          return;
        }
      } catch (error) {
        if (error && error.name === "AbortError") return;
      }
      try {
        await navigator.clipboard.writeText(shareUrl);
        setStatus("Share URL copied.");
      } catch (error) {
        window.prompt("Copy share URL", shareUrl);
      }
    }

    function setStatus(message) {
      const element = document.getElementById("statusText");
      if (element) element.textContent = message || "";
    }

    function publicAssetUrl(asset) {
      return asset && asset.storage_bucket && asset.storage_path
        ? `${SUPABASE_URL}/storage/v1/object/public/${asset.storage_bucket}/${asset.storage_path}`
        : "";
    }

    async function supabaseGet(table, params) {
      const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`);
      Object.entries(params || {}).forEach(([key, value]) => url.searchParams.set(key, value));
      const response = await fetch(url, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      });
      if (!response.ok) throw new Error(`${table} ${response.status}`);
      return response.json();
    }

    function hasDisplayValue(value) {
      if (value === null || value === undefined) return false;
      if (Array.isArray(value)) return value.length > 0;
      return String(value).trim() !== "";
    }

    function richRow(key, html, className = "") {
      if (!hasDisplayValue(html)) return "";
      const classSuffix = className ? ` ${escapeAttr(className)}` : "";
      return `<div class="detail-row${classSuffix}"><div class="detail-key">${escapeHtml(key)}</div><div class="detail-value">${html}</div></div>`;
    }

    function row(key, value, className = "") {
      return richRow(key, escapeHtml(value), className);
    }

    function mentionRow(key, value, className = "") {
      return richRow(key, renderMentionText(value), className);
    }

    let mentionWorks = [];
    let mentionSeries = [];

    function collectMentionNos(...texts) {
      const set = new Set();
      texts.forEach(text => {
        const raw = String(text ?? "");
        const pattern = /@(\d{4})(?!\d)/g;
        let match;
        while ((match = pattern.exec(raw)) !== null) set.add(normalizeNo(match[1]));
      });
      return [...set].filter(Boolean);
    }

    async function loadMentionTargetsForTexts(...texts) {
      const nos = collectMentionNos(...texts);
      mentionWorks = [];
      mentionSeries = [];
      if (!nos.length) return;
      const inList = `in.(${nos.map(no => `"${no}"`).join(",")})`;
      const [workRows, seriesRows] = await Promise.all([
        supabaseGet("wsv_works", { select: "id,work_no,title,title_en,is_public", work_no: inList, is_public: "eq.true" }).catch(() => []),
        supabaseGet("wsv_series", { select: "id,series_no,code,title,title_en,is_public", series_no: inList, is_public: "eq.true" }).catch(() => [])
      ]);
      mentionWorks = Array.isArray(workRows) ? workRows : [];
      mentionSeries = Array.isArray(seriesRows) ? seriesRows : [];
    }

    function mentionTargetByNo(no) {
      const cleanNo = normalizeNo(no);
      if (!cleanNo) return null;
      const work = mentionWorks.find(item => normalizeNo(item.work_no) === cleanNo);
      if (work) return { type: "work", label: "WORK", title: workTitle(work) || cleanNo, no: cleanNo };
      const series = mentionSeries.find(item => normalizeNo(item.series_no) === cleanNo);
      if (series) return { type: "series", label: "SERIES", title: seriesTitle(series) || cleanNo, no: cleanNo };
      return null;
    }

    function renderMentionText(value) {
      const raw = String(value ?? "");
      if (!hasDisplayValue(raw)) return "";
      const pattern = /@(\d{4})(?!\d)/g;
      let html = "";
      let lastIndex = 0;
      let match;
      while ((match = pattern.exec(raw)) !== null) {
        html += escapeHtml(raw.slice(lastIndex, match.index));
        const target = mentionTargetByNo(match[1]);
        if (target) {
          html += `<a class="mention-link" href="${escapeAttr(detailUrl(target.type, target.no))}" target="_blank" rel="noopener noreferrer"><span class="mention-kind">[${escapeHtml(target.label)}]</span>${escapeHtml(target.title)}</a>`;
        } else {
          html += escapeHtml(match[0]);
        }
        lastIndex = pattern.lastIndex;
      }
      html += escapeHtml(raw.slice(lastIndex));
      return html;
    }

    function authorRowHtml() {
      return `<div class="detail-row author-row"><div class="detail-key">Author</div><div class="detail-value"><a href="../profile/">しらすサラダ/SHIRASUSALAD</a></div></div>`;
    }

    function linksHtml(links) {
      return (links || [])
        .filter(link => link && hasDisplayValue(link.url))
        .map(link => `<div class="detail-row"><div class="detail-key">URL</div><div class="detail-value"><a href="${escapeAttr(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.title || link.url)}</a></div></div>`)
        .join("");
    }

    function assetFigureHtml(asset, fallbackAlt) {
      const url = publicAssetUrl(asset);
      if (!url) return "";
      return `<figure><img src="${escapeAttr(url)}" alt="${escapeAttr(asset.alt_text || asset.file_name || fallbackAlt)}">${asset.caption ? `<figcaption class="caption">${escapeHtml(asset.caption)}</figcaption>` : ""}</figure>`;
    }

    function seriesLogos(assets) {
      return (assets || []).filter(asset => asset.asset_type === "series_logo" || asset.asset_type === "work_logo");
    }

    function firstLogoAsset(assets) {
      const logos = seriesLogos(assets);
      return logos.length ? logos[0] : null;
    }

    function mediaRow(key, className, innerHtml) {
      return hasDisplayValue(innerHtml)
        ? `<div class="detail-row ${className}"><div class="detail-key">${escapeHtml(key)}</div><div class="detail-value">${innerHtml}</div></div>`
        : "";
    }

    function topLogoRowHtml(assets) {
      const logo = firstLogoAsset(assets);
      if (!logo) return "";
      return mediaRow("Logo", "top-logo-row", `<div class="top-logo-stack">${assetFigureHtml(logo, "Logo")}</div>`);
    }

    function bottomLogosRowHtml(assets) {
      const first = firstLogoAsset(assets);
      const logos = seriesLogos(assets).filter(asset => !first || asset.id !== first.id);
      if (!logos.length) return "";
      return mediaRow("Logo", "bottom-logo-row", `<div class="bottom-logo-stack">${logos.map(asset => assetFigureHtml(asset, "Logo")).join("")}</div>`);
    }

    function worksRowHtml(works) {
      if (!works.length) return "";
      const listHtml = works.map(work => {
        const no = normalizeNo(work.work_no);
        const title = workTitle(work);
        const date = work.completed_date || work.start_date || "";
        return `<a class="work-link-row" href="../work/?no=${encodeURIComponent(no)}" target="_blank" rel="noopener noreferrer"><span>${escapeHtml(no)}</span><span>${escapeHtml(title)}</span><span>${escapeHtml(date)}</span></a>`;
      }).join("");
      return mediaRow("Works", "works-row", `<div class="work-list">${listHtml}</div>`);
    }

    function slashDateFrom(value) {
      if (!value) return "----/--/--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).slice(0, 10).replaceAll("-", "/") || "----/--/--";
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}/${month}/${day}`;
    }

    const CODE128_PATTERNS = [
      "11011001100", "11001101100", "11001100110", "10010011000", "10010001100", "10001001100", "10011001000", "10011000100", "10001100100", "11001001000",
      "11001000100", "11000100100", "10110011100", "10011011100", "10011001110", "10111001100", "10011101100", "10011100110", "11001110010", "11001011100",
      "11001001110", "11011100100", "11001110100", "11101101110", "11101001100", "11100101100", "11100100110", "11101100100", "11100110100", "11100110010",
      "11011011000", "11011000110", "11000110110", "10100011000", "10001011000", "10001000110", "10110001000", "10001101000", "10001100010", "11010001000",
      "11000101000", "11000100010", "10110111000", "10110001110", "10001101110", "10111011000", "10111000110", "10001110110", "11101110110", "11010001110",
      "11000101110", "11011101000", "11011100010", "11011101110", "11101011000", "11101000110", "11100010110", "11101101000", "11101100010", "11100011010",
      "11101111010", "11001000010", "11110001010", "10100110000", "10100001100", "10010110000", "10010000110", "10000101100", "10000100110", "10110010000",
      "10110000100", "10011010000", "10011000010", "10000110100", "10000110010", "11000010010", "11001010000", "11110111010", "11000010100", "10001111010",
      "10100111100", "10010111100", "10010011110", "10111100100", "10011110100", "10011110010", "11110100100", "11110010100", "11110010010", "11011011110",
      "11011110110", "11110110110", "10101111000", "10100011110", "10001011110", "10111101000", "10111100010", "11110101000", "11110100010", "10111011110",
      "10111101110", "11101011110", "11110101110", "11010000100", "11010010000", "11010011100", "1100011101011"
    ];

    function code128ValueForChar(char) {
      const code = char.charCodeAt(0);
      if (code < 32 || code > 126) return null;
      return code - 32;
    }

    function createCode128Svg(text) {
      const safeText = String(text || "");
      const codes = [104];
      for (const char of safeText) {
        const value = code128ValueForChar(char);
        if (value !== null) codes.push(value);
      }
      let checksum = codes[0];
      for (let i = 1; i < codes.length; i++) checksum += codes[i] * i;
      codes.push(checksum % 103);
      codes.push(106);

      const modules = [];
      codes.forEach(code => {
        const pattern = CODE128_PATTERNS[code];
        for (const bit of pattern) modules.push(bit === "1" ? 1 : 0);
      });

      const barHeight = 108;
      let x = 0;
      let rects = "";
      let i = 0;
      while (i < modules.length) {
        const bit = modules[i];
        let width = 1;
        while (i + width < modules.length && modules[i + width] === bit) width++;
        if (bit === 1) rects += `<rect x="${x}" y="0" width="${width}" height="${barHeight}"></rect>`;
        x += width;
        i += width;
      }
      return `<svg class="dos-barcode-svg" viewBox="0 0 ${x} ${barHeight}" preserveAspectRatio="none" role="img" aria-label="${escapeAttr(safeText)} barcode" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
    }

    function setDosBarcode(kind, no) {
      const idText = `${kind} ID:${normalizeNo(no)}`;
      ["dosBarcode", "dosBarcodeBottom"].forEach(targetId => {
        const target = document.getElementById(targetId);
        if (!target) return;
        target.innerHTML = `${createCode128Svg(idText)}<div class="dos-barcode-text">${escapeHtml(idText)}</div>`;
      });
    }

    function setDosHeader(kind, no, updatedAt = "") {
      setDosBarcode(kind, no);
      const update = document.getElementById("dosUpdateDate");
      if (update) update.textContent = `UPDATE:${slashDateFrom(updatedAt)}`;
    }

    let currentDetailKind = "";
    let currentDetailNo = "";
    let currentDetailTitle = "";

    function setCurrentDetail(kind, no, title) {
      currentDetailKind = kind;
      currentDetailNo = normalizeNo(no);
      currentDetailTitle = title || "";
    }

    window.closeDocumentPage = function() {
      try { window.close(); } catch (error) {}
      if (!window.closed) {
        if (history.length > 1) history.back();
        else location.href = "../";
      }
    };

    window.shareFixedDocument = function() {
      if (!currentDetailKind || !currentDetailNo) return;
      shareCurrent(currentDetailKind, currentDetailNo, currentDetailTitle || document.title || "VAMRSS");
    };

    async function loadSeriesPage() {
      const no = getQueryNo();
      const detailHost = document.getElementById("detailHost");
      if (no) {
        setDosHeader("SERIES", no);
        setCurrentDetail("series", no, "");
      }
      if (!no) {
        detailHost.innerHTML = "シリーズ番号が指定されていません。";
        return;
      }

      try {
        const rows = await supabaseGet("wsv_series", { select: "*", series_no: `eq.${no}`, limit: "1" });
        const series = rows[0];
        if (!series) {
          detailHost.innerHTML = `シリーズ №${escapeHtml(no)} は見つかりませんでした。`;
          return;
        }

        setDosHeader("SERIES", series.series_no, series.content_updated_at || series.updated_at || series.created_at);

        const [works, assets, links] = await Promise.all([
          supabaseGet("wsv_works", { select: "id,work_no,title,title_en,series_id,completed_date,start_date", series_id: `eq.${series.id}`, order: "work_no.asc" }),
          supabaseGet("wsv_assets", { select: "*", series_id: `eq.${series.id}`, is_public: "eq.true", order: "sort_order.asc,created_at.asc" }),
          supabaseGet("wsv_related_links", { select: "*", target_type: "eq.series", series_id: `eq.${series.id}`, is_public: "eq.true", order: "sort_order.asc,created_at.asc" })
        ]);

        await loadMentionTargetsForTexts(series.description, series.description_en);

        const title = seriesTitle(series);
        document.title = `VAMRSS / ${title}`;
        setCurrentDetail("series", series.series_no, title);
        detailHost.classList.remove("empty");
        detailHost.innerHTML = `<div class="detail-grid">${row("Title", title, "series-title-row")}${row("T_EN", series.title_en, "series-title-en-row")}${topLogoRowHtml(assets)}${authorRowHtml()}${row("Type", "[SERIES]")}${row("№", normalizeNo(series.series_no))}${row("Code", series.code)}${row("Start", series.start_date)}${row("Count", String(works.length))}${mentionRow("Description", series.description, "description-row")}${mentionRow("D_EN", series.description_en, "description-en-row")}${linksHtml(links)}${worksRowHtml(works)}${bottomLogosRowHtml(assets)}</div>`;
      } catch (error) {
        console.error(error);
        detailHost.innerHTML = "読み込みに失敗しました。";
      }
    }

    loadSeriesPage();
  </script>
</body>
</html>
