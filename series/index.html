    const SUPABASE_URL = "https://xovbmsyjhtlxldtjbvvm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gP9cTUqzNytHEXRUY9-dug__quOy4fv";
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g,"&#096;"); }
    function normalizeNo(value) { const raw=String(value??"").trim(); if(!raw) return ""; const d=raw.replace(/\D/g,""); return d ? d.padStart(4,"0").slice(-4) : raw; }
    function formatMoney(value) { if(value===null||value===undefined||value==="") return ""; const n=Number(value); return Number.isFinite(n) ? "¥"+Math.round(n).toLocaleString("ja-JP") : ""; }
    function formatDimensions(w) { const h=w.size_h??"", ww=w.size_w??"", d=w.size_d??""; const p=[]; if(h!=="")p.push(`H ${h}`); if(ww!=="")p.push(`W ${ww}`); if(d!=="")p.push(`D ${d}`); return p.length ? p.join(" / ")+" mm" : ""; }

    function getQueryNo() { return normalizeNo(new URLSearchParams(location.search).get("no") || ""); }
    function siteBaseUrl() { const path=location.pathname||"/"; const lower=path.toLowerCase(); let basePath=path; ["/work/","/series/","/updates/","/profile/","/admin/","/portfolio/"].forEach(seg=>{const i=lower.indexOf(seg); if(i>=0) basePath=path.slice(0,i+1);}); return location.origin+basePath; }
    function detailUrl(type,no) { return `${siteBaseUrl()}${type==="series"?"series":"work"}/?no=${encodeURIComponent(normalizeNo(no))}`; }
    async function shareCurrent(type,no,title) { const shareUrl=detailUrl(type,no); const shareTitle=title?`VAMRSS / ${title}`:"VAMRSS"; try { if(navigator.share) { await navigator.share({title:shareTitle,text:shareTitle,url:shareUrl}); return; } } catch(e) { if(e&&e.name==="AbortError") return; } try { await navigator.clipboard.writeText(shareUrl); setStatus("Share URL copied."); } catch(e) { window.prompt("Copy share URL", shareUrl); } }
    function setStatus(message) { const el=document.getElementById("statusText"); if(el) el.textContent=message||""; }
    function publicAssetUrl(asset) { return asset&&asset.storage_bucket&&asset.storage_path ? `${SUPABASE_URL}/storage/v1/object/public/${asset.storage_bucket}/${asset.storage_path}` : ""; }
    async function supabaseGet(table, params) { const u=new URL(`${SUPABASE_URL}/rest/v1/${table}`); Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v)); const r=await fetch(u,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}}); if(!r.ok) throw new Error(`${table} ${r.status}`); return r.json(); }
    function hasDisplayValue(value) { if(value===null||value===undefined) return false; if(Array.isArray(value)) return value.length>0; return String(value).trim()!==""; }
    function row(key,value) { if(!hasDisplayValue(value)) return ""; return `<div class="detail-row"><div class="detail-key">${escapeHtml(key)}</div><div class="detail-value">${escapeHtml(value)}</div></div>`; }
    function linksHtml(links) { return (links||[]).filter(l=>l&&hasDisplayValue(l.url)).map(l=>`<div class="detail-row"><div class="detail-key">URL</div><div class="detail-value"><a href="${escapeAttr(l.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.title||l.url)}</a></div></div>`).join(""); }
    function assetFigureHtml(asset, fallbackAlt) { return `<figure><img src="${escapeAttr(publicAssetUrl(asset))}" alt="${escapeAttr(asset.alt_text||asset.file_name||fallbackAlt)}">${asset.caption?`<figcaption class="caption">${escapeHtml(asset.caption)}</figcaption>`:""}</figure>`; }
    function seriesLogos(assets) { return (assets||[]).filter(a=>a.asset_type==="series_logo"||a.asset_type==="work_logo"); }
    function firstLogoAsset(assets) { const logos=seriesLogos(assets); return logos.length ? logos[0] : null; }

    function bottomLogosRowHtml(assets) { const first=firstLogoAsset(assets); const logos=seriesLogos(assets).filter(a=>!first || a.id!==first.id); if(!logos.length) return ""; return mediaRow("Logo", "bottom-logo-row", `<div class="bottom-logo-stack">${logos.map(a=>assetFigureHtml(a,"Logo")).join("")}</div>`); }

    async function loadSeriesPage() {
      const no=getQueryNo();
      if(!no) { document.getElementById("detailHost").innerHTML="シリーズ番号が指定されていません。"; return; }
      try {
        const rows=await supabaseGet("wsv_series",{select:"*",series_no:`eq.${no}`,limit:"1"});

          supabaseGet("wsv_assets",{select:"*",series_id:`eq.${series.id}`,is_public:"eq.true",order:"sort_order.asc,created_at.asc"}),

        ]);
        const title=seriesTitle(series); document.title=`VAMRSS / ${title}`;
        document.getElementById("detailHost").classList.remove("empty");
        document.getElementById("detailHost").innerHTML=`<div class="detail-grid">${topLogoRowHtml(assets)}${row("Type","[SERIES]")}${row("№",normalizeNo(series.series_no))}${row("Code",series.code)}${row("Title",title)}${row("T_EN",series.title_en)}${row("Start",series.start_date)}${row("Count",String(works.length))}${row("Description",series.description)}${row("D_EN",series.description_en)}${linksHtml(links)}${worksRowHtml(works)}${bottomLogosRowHtml(assets)}</div><div class="action-row"><button class="text-button" type="button" onclick="shareCurrent('series','${escapeAttr(no)}','${escapeAttr(title)}')">SHARE</button><a class="text-button" href="../">BACK TO LIST</a></div>`;
      } catch(e) { console.error(e); document.getElementById("detailHost").innerHTML="読み込みに失敗しました。"; }
    }
    loadSeriesPage();
