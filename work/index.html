<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>VAMRSS / WORK</title><link rel="icon" href="../images/favicon.png" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="VAMRSS work detail page."><style>
    :root { --bg:#f4f6f7; --surface:#ffffff; --surface-soft:#eef1f2; --ink:#101722; --sub:#657176; --muted:#a0a8ac; --line:#d7dde0; --line-strong:#bfc8cc; --deep:#071c16; --danger:#9b3144; --font-main:"Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    html { background: var(--bg); -webkit-text-size-adjust: 100%; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--font-main); font-size:13px; font-weight:400; line-height:1.8; }
    button,input,textarea,select { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .app { width:min(100%,520px); margin:0 auto; padding:20px; }
    .topbar { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:start; margin-bottom:28px; }
    .brand { display:grid; gap:6px; min-width:0; }
    .brand img { display:block; width:min(145px,42vw); height:auto; transform:translateY(0.5em); margin-bottom:0.5em; }
    .brand-caption { color:var(--sub); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; }
    .nav { display:flex; justify-content:flex-end; gap:12px; font-size:11px; letter-spacing:0.04em; white-space:nowrap; }
    .hero-media { margin:1.25em 0; }
    .hero-media img, .logo-stack img { display:block; max-width:100%; height:auto; }
    .logo-stack { display:grid; gap:1.5em; margin:1.25em 0; }
    .caption { margin-top:0.35em; color:var(--sub); font-size:11px; line-height:1.7; }
    .type-label { color:var(--sub); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; margin-top:18px; }
    .title { margin:8px 0 0; font-size:20px; line-height:1.55; font-weight:500; overflow-wrap:anywhere; }
    .sub-title { margin-top:4px; color:var(--sub); font-size:12px; line-height:1.7; overflow-wrap:anywhere; }
    .detail-grid { display:grid; gap:1px; margin-top:22px; border-top:1px solid var(--line); padding-top:12px; }
    .detail-row { display:grid; grid-template-columns:88px minmax(0,1fr); gap:10px; align-items:baseline; padding:1px 0; }
    .detail-key { color:var(--muted); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; }
    .detail-value { color:var(--ink); white-space:pre-wrap; overflow-wrap:anywhere; }
    .section { margin-top:28px; }
    .section-title { color:var(--muted); font-size:12px; letter-spacing:0.13em; text-transform:uppercase; margin-bottom:6px; }
    .work-list { display:grid; gap:0; border-top:1px solid var(--line); }
    .work-link-row { display:grid; grid-template-columns:4.5em minmax(0,1fr) 7.5em; gap:1em; align-items:baseline; border-bottom:1px solid var(--line); padding:4px 0; }
    .work-link-row span:nth-child(1), .work-link-row span:nth-child(3) { color:var(--sub); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .work-link-row span:nth-child(3) { text-align:right; }
    .action-row { display:flex; justify-content:flex-end; gap:1.25em; flex-wrap:wrap; margin-top:28px; border-top:1px solid var(--line); padding-top:14px; }
    .text-button { border:0; background:transparent; color:var(--sub); font-size:11px; letter-spacing:0.04em; padding:0; cursor:pointer; text-decoration:none; }
    .status { margin-top:16px; color:var(--sub); font-size:11px; }
    .empty { color:var(--sub); padding:24px 0; }
    .version { margin-top:34px; color:var(--muted); font-size:10px; text-align:right; }
    @media (max-width:420px) { .app{padding:18px;} .topbar{gap:16px;} .nav{gap:10px;} .detail-row{grid-template-columns:74px minmax(0,1fr);} .work-link-row{grid-template-columns:4em minmax(0,1fr) 7em;} }
</style></head><body><main class="app"><header class="topbar"><div class="brand"><a href="../"><img src="../admin/assets/wsv-logo.svg" alt="VAMRSS"></a><div class="brand-caption">WORK DETAIL</div></div><nav class="nav"><a href="../">HOME</a><a href="../updates/">UPDATES</a><a href="../profile/">ABOUT</a></nav></header><section id="detailHost" class="empty">Loading...</section><div class="status" id="statusText"></div><div class="version">v3.9.4</div></main><script>
    const SUPABASE_URL = "https://xovbmsyjhtlxldtjbvvm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gP9cTUqzNytHEXRUY9-dug__quOy4fv";
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g,"&#096;"); }
    function normalizeNo(value) { const raw=String(value??"").trim(); if(!raw) return ""; const d=raw.replace(/\D/g,""); return d ? d.padStart(4,"0").slice(-4) : raw; }
    function formatMoney(value) { if(value===null||value===undefined||value==="") return ""; const n=Number(value); return Number.isFinite(n) ? "¥"+Math.round(n).toLocaleString("ja-JP") : ""; }
    function formatDimensions(w) { const h=w.size_h??"", ww=w.size_w??"", d=w.size_d??""; const p=[]; if(h!=="")p.push(`H ${h}`); if(ww!=="")p.push(`W ${ww}`); if(d!=="")p.push(`D ${d}`); return p.length ? p.join(" / ")+" mm" : ""; }
    function workTitle(w) { return w.title || w.title_ja || w.title_en || "Untitled"; }
    function seriesTitle(s) { return s.title || s.title_ja || s.title_en || "Untitled"; }
    function getQueryNo() { return normalizeNo(new URLSearchParams(location.search).get("no") || ""); }
    function siteBaseUrl() { const path=location.pathname||"/"; const lower=path.toLowerCase(); let basePath=path; ["/work/","/series/","/updates/","/profile/","/admin/","/portfolio/"].forEach(seg=>{const i=lower.indexOf(seg); if(i>=0) basePath=path.slice(0,i+1);}); return location.origin+basePath; }
    function detailUrl(type,no) { return `${siteBaseUrl()}${type==="series"?"series":"work"}/?no=${encodeURIComponent(normalizeNo(no))}`; }
    async function shareCurrent(type,no,title) { const shareUrl=detailUrl(type,no); const shareTitle=title?`VAMRSS / ${title}`:"VAMRSS"; try { if(navigator.share) { await navigator.share({title:shareTitle,text:shareTitle,url:shareUrl}); return; } } catch(e) { if(e&&e.name==="AbortError") return; } try { await navigator.clipboard.writeText(shareUrl); setStatus("Share URL copied."); } catch(e) { window.prompt("Copy share URL", shareUrl); } }
    function setStatus(message) { const el=document.getElementById("statusText"); if(el) el.textContent=message||""; }
    function publicAssetUrl(asset) { return asset&&asset.storage_bucket&&asset.storage_path ? `${SUPABASE_URL}/storage/v1/object/public/${asset.storage_bucket}/${asset.storage_path}` : ""; }
    async function supabaseGet(table, params) { const u=new URL(`${SUPABASE_URL}/rest/v1/${table}`); Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v)); const r=await fetch(u,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}}); if(!r.ok) throw new Error(`${table} ${r.status}`); return r.json(); }
    function row(key,value) { if(value===null||value===undefined||value==="") return ""; return `<div class="detail-row"><div class="detail-key">${escapeHtml(key)}</div><div class="detail-value">${escapeHtml(value)}</div></div>`; }
    function linksHtml(links) { return (links||[]).map(l=>l&&l.url?`<div class="detail-row"><div class="detail-key">URL</div><div class="detail-value"><a href="${escapeAttr(l.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.title||l.url)}</a></div></div>`:"").join(""); }
    function logoHtml(assets) { const logos=(assets||[]).filter(a=>a.asset_type==="work_logo"||a.asset_type==="series_logo"); if(!logos.length) return ""; return `<div class="logo-stack">${logos.map(a=>`<figure><img src="${escapeAttr(publicAssetUrl(a))}" alt="${escapeAttr(a.alt_text||a.file_name||"Logo")}">${a.caption?`<figcaption class="caption">${escapeHtml(a.caption)}</figcaption>`:""}</figure>`).join("")}</div>`; }
    function coverImageHtml(assets) { const imgs=(assets||[]).filter(a=>a.asset_type==="work_image"); if(!imgs.length) return ""; const c=imgs.find(a=>a.is_cover)||imgs[0]; return `<figure class="hero-media"><img src="${escapeAttr(publicAssetUrl(c))}" alt="${escapeAttr(c.alt_text||c.file_name||"Work image")}">${c.caption?`<figcaption class="caption">${escapeHtml(c.caption)}</figcaption>`:""}</figure>`; }

    async function loadWorkPage() {
      const no=getQueryNo();
      if(!no) { document.getElementById("detailHost").innerHTML="作品番号が指定されていません。"; return; }
      try {
        const rows=await supabaseGet("wsv_works",{select:"id,work_no,title,title_en,series_id,start_date,completed_date,production_status,management_status,technique,materials,size_h,size_w,size_d,location,holder_name,description,description_en,logo_asset_id,cover_asset_id,is_public,sort_order,created_at,updated_at,content_updated_at",work_no:`eq.${no}`,limit:"1"});
        const work=rows[0];
        if(!work) { document.getElementById("detailHost").innerHTML=`作品 №${escapeHtml(no)} は見つかりませんでした。`; return; }
        const [seriesRows,assets,links]=await Promise.all([
          work.series_id ? supabaseGet("wsv_series",{select:"*",id:`eq.${work.series_id}`,limit:"1"}) : Promise.resolve([]),
          supabaseGet("wsv_assets",{select:"*",work_id:`eq.${work.id}`,is_public:"eq.true",order:"sort_order.asc,created_at.asc"}),
          supabaseGet("wsv_related_links",{select:"*",target_type:"eq.work",work_id:`eq.${work.id}`,is_public:"eq.true",order:"sort_order.asc,created_at.asc"})
        ]);
        const series=seriesRows[0], title=workTitle(work); document.title=`VAMRSS / ${title}`; document.getElementById("detailHost").classList.remove("empty");
        document.getElementById("detailHost").innerHTML=`${coverImageHtml(assets)}${logoHtml(assets)}<div class="type-label">[WORK]</div><h1 class="title">${escapeHtml(title)}</h1>${work.title_en?`<div class="sub-title">${escapeHtml(work.title_en)}</div>`:""}<div class="detail-grid">${row("№",normalizeNo(work.work_no))}${row("Series",series?`${series.code?series.code+" / ":""}${seriesTitle(series)}`:"")}${row("Start",work.start_date)}${row("Completed",work.completed_date)}${row("Production",work.production_status)}${row("Management",work.management_status)}${row("Technique",work.technique)}${row("Materials",work.materials)}${row("Size",formatDimensions(work))}${row("Price","*******")}${row("Cost","*******")}${row("Description",work.description)}${row("D_EN",work.description_en)}${linksHtml(links)}</div><div class="action-row"><button class="text-button" type="button" onclick="shareCurrent('work','${escapeAttr(no)}','${escapeAttr(title)}')">SHARE</button><a class="text-button" href="../">BACK TO LIST</a></div>`;
      } catch(e) { console.error(e); document.getElementById("detailHost").innerHTML="読み込みに失敗しました。"; }
    }
    loadWorkPage();
  </script></body></html>
