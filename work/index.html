    function bottomLogosRowHtml(assets) { const first=firstLogoAsset(assets); const logos=workLogos(assets).filter(a=>!first || a.id!==first.id); if(!logos.length) return ""; return mediaRow("Logo", "bottom-logo-row", `<div class="bottom-logo-stack">${logos.map(a=>assetFigureHtml(a,"Logo")).join("")}</div>`); }

    function todaySlashDate() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}/${m}/${day}`;
    }

    function slashDateFrom(value) {
      if (!value) return "----/--/--";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value).slice(0, 10).replaceAll("-", "/") || "----/--/--";
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}/${m}/${day}`;
    }


    const CODE128_PATTERNS = [
      "11011001100","11001101100","11001100110","10010011000","10010001100","10001001100","10011001000","10011000100","10001100100","11001001000",
      "11001000100","11000100100","10110011100","10011011100","10011001110","10111001100","10011101100","10011100110","11001110010","11001011100",
      "11001001110","11011100100","11001110100","11101101110","11101001100","11100101100","11100100110","11101100100","11100110100","11100110010",
      "11011011000","11011000110","11000110110","10100011000","10001011000","10001000110","10110001000","10001101000","10001100010","11010001000",
      "11000101000","11000100010","10110111000","10110001110","10001101110","10111011000","10111000110","10001110110","11101110110","11010001110",
      "11000101110","11011101000","11011100010","11011101110","11101011000","11101000110","11100010110","11101101000","11101100010","11100011010",
      "11101111010","11001000010","11110001010","10100110000","10100001100","10010110000","10010000110","10000101100","10000100110","10110010000",
      "10110000100","10011010000","10011000010","10000110100","10000110010","11000010010","11001010000","11110111010","11000010100","10001111010",
      "10100111100","10010111100","10010011110","10111100100","10011110100","10011110010","11110100100","11110010100","11110010010","11011011110",
      "11011110110","11110110110","10101111000","10100011110","10001011110","10111101000","10111100010","11110101000","11110100010","10111011110",
      "10111101110","11101011110","11110101110","11010000100","11010010000","11010011100","1100011101011"
    ];

    function code128ValueForChar(char) {
      const code = char.charCodeAt(0);
      if (code < 32 || code > 126) return null;
      return code - 32;
    }

    function createCode128Svg(text) {
      const safeText = String(text || "");
      const codes = [104];
      for (const char of safeText) {
        const value = code128ValueForChar(char);
        if (value !== null) codes.push(value);
      }
      let checksum = codes[0];
      for (let i = 1; i < codes.length; i++) checksum += codes[i] * i;
      codes.push(checksum % 103);
      codes.push(106);

      const modules = [];
      codes.forEach(code => {
        const pattern = CODE128_PATTERNS[code];
        for (const bit of pattern) modules.push(bit === "1" ? 1 : 0);
      });

      const barHeight = 108;
      const quiet = 0;
      let x = quiet;
      let rects = "";
      let i = 0;
      while (i < modules.length) {
        const bit = modules[i];
        let width = 1;
        while (i + width < modules.length && modules[i + width] === bit) width++;
        if (bit === 1) rects += `<rect x="${x}" y="0" width="${width}" height="${barHeight}"></rect>`;
        x += width;
        i += width;
      }
      const totalWidth = x + quiet;
      return `<svg class="dos-barcode-svg" viewBox="0 0 ${totalWidth} ${barHeight}" preserveAspectRatio="none" role="img" aria-label="${escapeAttr(safeText)} barcode" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
    }

    function setDosBarcode(kind, no) {
      const target = document.getElementById("dosBarcode");
      if (!target) return;
      const idText = `${kind} ID:${normalizeNo(no)}`;
      target.innerHTML = `${createCode128Svg(idText)}<div class="dos-barcode-text">${escapeHtml(idText)}</div>`;
    }

    function setDosHeader(kind, no, updatedAt = "") {
      const update = document.getElementById("dosUpdateDate");
      setDosBarcode(kind, no);
      if (update) update.textContent = `UPDATE:${slashDateFrom(updatedAt)}`;
    }


    let currentDetailKind = "";
    let currentDetailNo = "";
    let currentDetailTitle = "";

    function setCurrentDetail(kind, no, title) {
      currentDetailKind = kind;
      currentDetailNo = normalizeNo(no);
      currentDetailTitle = title || "";
    }

    window.closeDocumentPage = function() {
      try { window.close(); } catch (error) {}
      if (!window.closed) {
        if (history.length > 1) history.back();
        else location.href = "../";
      }
    };

    window.shareFixedDocument = function() {
      if (!currentDetailKind || !currentDetailNo) return;
      shareCurrent(currentDetailKind, currentDetailNo, currentDetailTitle || document.title || "VAMRSS");
    };

    async function loadWorkPage() {
      const no=getQueryNo();
      if (no) { setDosHeader("WORKS", no); setCurrentDetail("work", no, ""); }
      if(!no) { document.getElementById("detailHost").innerHTML="作品番号が指定されていません。"; return; }
      try {
        const rows=await supabaseGet("wsv_works",{select:"id,work_no,title,title_en,series_id,start_date,completed_date,production_status,management_status,technique,materials,size_h,size_w,size_d,location,holder_name,description,description_en,logo_asset_id,cover_asset_id,is_public,sort_order,created_at,updated_at,content_updated_at",work_no:`eq.${no}`,limit:"1"});
        const work=rows[0];
        if(!work) { document.getElementById("detailHost").innerHTML=`作品 №${escapeHtml(no)} は見つかりませんでした。`; return; }
        setDosHeader("WORKS", work.work_no, work.content_updated_at || work.updated_at || work.created_at);
        const [seriesRows,assets,links]=await Promise.all([
          work.series_id ? supabaseGet("wsv_series",{select:"*",id:`eq.${work.series_id}`,limit:"1"}) : Promise.resolve([]),
          supabaseGet("wsv_assets",{select:"*",work_id:`eq.${work.id}`,is_public:"eq.true",order:"sort_order.asc,created_at.asc"}),
          supabaseGet("wsv_related_links",{select:"*",target_type:"eq.work",work_id:`eq.${work.id}`,is_public:"eq.true",order:"sort_order.asc,created_at.asc"})
        ]);
        const series=seriesRows[0], title=workTitle(work); document.title=`VAMRSS / ${title}`; setCurrentDetail("work", work.work_no, title); document.getElementById("detailHost").classList.remove("empty");
        document.getElementById("detailHost").innerHTML=`<div class="detail-grid">${topImageRowHtml(assets)}${topLogoRowHtml(assets)}${row("Type","[WORK]")}${row("№",normalizeNo(work.work_no))}${row("Title",title)}${row("T_EN",work.title_en)}${row("Series",series?`${series.code?series.code+" / ":""}${seriesTitle(series)}`:"")}${row("Start",work.start_date)}${row("Completed",work.completed_date)}${row("Production",work.production_status)}${row("Management",work.management_status)}${row("Technique",work.technique)}${row("Materials",work.materials)}${row("Size",formatDimensions(work))}${row("Description",work.description)}${row("D_EN",work.description_en)}${linksHtml(links)}${bottomImagesRowHtml(assets)}${bottomLogosRowHtml(assets)}</div>`;
      } catch(e) { console.error(e); document.getElementById("detailHost").innerHTML="読み込みに失敗しました。"; }
    }
    loadWorkPage();
  </script></body></html>
